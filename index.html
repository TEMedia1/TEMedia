
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folder Menu</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

/* Full screen container */
.folder-screen {
  width: 100%;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px;
}

/* 2 columns x 5 rows */
.folder-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-template-rows: repeat(5, 1fr);
  gap: 20px;

  width: 100%;
  max-width: 1100px;
}

/* Folder boxes */
.folder-menu {
  background: #111;
  border: 1px solid #333;
  border-radius: 8px;
  padding: 15px;
  min-height: 120px;
}

/* Folder heading */
.folder-menu summary {
  cursor: pointer;
  padding: 15px;
  background: #222;
  border-radius: 5px;
  list-style: none;
  font-size: 18px;
}

.folder-menu summary:hover {
  background: #333;
}

/* Remove default arrow */
.folder-menu summary::-webkit-details-marker {
  display: none;
}

/* Folder contents */
.folder-content {
  padding-left: 15px;
  margin-top: 10px;
}

.folder-content a {
  display: block;
  color: #ccc;
  text-decoration: none;
  padding: 10px;
  font-size: 14px;
  border-radius: 4px;
}

.folder-content a:hover {
  color: white;
  background: #333;
}

/* Responsive for mobile */
@media (max-width: 600px) {
  .folder-grid {
    grid-template-columns: 1fr;
    grid-template-rows: auto;
  }
}
</style>
</head>

<body>
